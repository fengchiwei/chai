# 少年仔、安啦會客室：跨平台自動建置
#   * smoke   ：Ubuntu 上以原始碼執行 desktop_launcher.py --check（/health 煙霧測試）
#   * windows ：PyInstaller → dist/AnlaYouth/AnlaYouth.exe，Inno Setup → AnlaYouth_Setup.exe
#   * macos   ：PyInstaller → AnlaYouth.app，hdiutil → AnlaYouth.dmg（未簽章、未公證）
#   * android ：Capacitor → 未簽章的 debug APK
#   * ios     ：（選用，手動觸發）Capacitor + xcodebuild 模擬器版編譯檢查，不產生 .ipa
#   * release ：推送 v* 標籤時，把上面的安裝檔附到 GitHub Releases 頁面
#
# 不使用、也不需要任何 API 金鑰；產物只連到 ANLA_SERVER_URL（Repository variable，非 secret）。
name: Build cross-platform

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_ios:
        description: "同時嘗試 iOS 模擬器版編譯（實驗性，不產生 .ipa）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-cross-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  smoke:
    name: Smoke test (/health)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install server dependencies
        run: python -m pip install -r requirements.txt
      - name: desktop_launcher.py --check
        env:
          DATABASE_PATH: ${{ runner.temp }}/smoke.db
        run: python desktop_launcher.py --check

  windows:
    name: Windows (.exe + Setup)
    needs: smoke
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Source smoke test
        env:
          DATABASE_PATH: ${{ runner.temp }}\source-smoke.db
        run: python desktop_launcher.py --check
      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
      - name: Compute version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") { $v = $env:GITHUB_REF_NAME.TrimStart("v") } else { $v = "1.3.0.$env:GITHUB_RUN_NUMBER" }
          "ANLA_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build exe, smoke test frozen exe, build installer
        env:
          PYTHONIOENCODING: utf-8
        run: python build_desktop.py --smoke --installer
      - name: Show launcher log
        if: always()
        shell: pwsh
        run: Get-Content "$env:APPDATA\AnlaYouth\launcher.log" -ErrorAction SilentlyContinue
      - name: Zip portable folder
        shell: pwsh
        run: Compress-Archive -Path dist\AnlaYouth -DestinationPath dist\AnlaYouth-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AnlaYouth-windows
          path: |
            dist/AnlaYouth_Setup.exe
            dist/AnlaYouth-windows-portable.zip
          if-no-files-found: error

  macos:
    name: macOS (.app + .dmg)
    needs: smoke
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Source smoke test
        env:
          DATABASE_PATH: ${{ runner.temp }}/source-smoke.db
        run: python desktop_launcher.py --check
      - name: Build .app, smoke test, build .dmg
        run: python build_desktop.py --smoke --dmg
      - name: Show launcher log
        if: always()
        run: cat "$HOME/Library/Application Support/AnlaYouth/launcher.log" || true
      - uses: actions/upload-artifact@v4
        with:
          name: AnlaYouth-macos
          path: dist/AnlaYouth.dmg
          if-no-files-found: error

  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Configure server URL
        env:
          ANLA_SERVER_URL: ${{ vars.ANLA_SERVER_URL }}
        run: node scripts/configure-server.mjs
      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android
      - name: Gradle assembleDebug
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AnlaYouth-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AnlaYouth-android-debug
          path: mobile/AnlaYouth-debug.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build (experimental, unsigned)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ios }}
    runs-on: macos-latest
    timeout-minutes: 40
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Configure server URL
        env:
          ANLA_SERVER_URL: ${{ vars.ANLA_SERVER_URL }}
        run: node scripts/configure-server.mjs
      - name: Add iOS platform (CocoaPods)
        run: |
          npx cap add ios
          npx cap sync ios
      - name: xcodebuild (simulator, no signing)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build

  release:
    name: Publish GitHub Release
    if: ${{ github.ref_type == 'tag' }}
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
