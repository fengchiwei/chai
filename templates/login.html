<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作臺登入｜少年仔、安啦會客室</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="background:#f1f5f9;">
  <main style="max-width:440px;margin:8vh auto;padding:2rem;background:white;border-radius:16px;border:1px solid #dbe3e8;">
    <h1 style="font-size:1.6rem;color:#1e3a8a;margin-bottom:1rem;">授權工作臺登入</h1>
    <p style="line-height:1.6;color:#475569;">個案資料只供已授權的人員在本機示範環境檢視。本系統目前不會自動聯繫學生、學校或公家單位。</p>
    {% if disabled %}
      <p role="alert" style="color:#b91c1c;">尚未設定 WORKBENCH_PASSWORD。請先在啟動 Flask 的 PowerShell 視窗設定後重新啟動。</p>
    {% else %}
      {% if error %}<p role="alert" style="color:#b91c1c;">{{ error }}</p>{% endif %}
      <form method="post" action="/login">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="password" style="display:block;margin:1rem 0 .4rem;">工作臺密碼</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" style="width:100%;padding:.75rem;border:1px solid #94a3b8;border-radius:8px;">
        <button type="submit" style="margin-top:1rem;padding:.8rem 1.2rem;border:0;border-radius:8px;background:#1e3a8a;color:white;cursor:pointer;">登入</button>
      </form>
    {% endif %}
    <p style="margin-top:1.3rem;"><a href="/">返回學生端</a></p>
  </main>
</body>
</html>
